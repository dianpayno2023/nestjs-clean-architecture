services:
  postgres:
    image: postgres:16-alpine
    container_name: nestjs-clean-architecture-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-clean_architecture_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d

  app:
    build:
      context: .
    container_name: nestjs-clean-architecture-app
    depends_on:
      - postgres
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
    ports:
      - "${PORT:-3000}:3000"
    command: npm run start:dev
    volumes:
      - .:/app
      - /app/node_modules

volumes:
  postgres_data:

